 jobmanager:
   build: ./Docker/flink/
   container_name: jobmanager
   ports:
     - "127.0.0.1:8081:8081"
   command: jobmanager
   volumes:
     - flink_data:/tmp/
     - ./FlinkJobs/:/opt/flink/FlinkJobs
   environment:
     - |
       FLINK_PROPERTIES=
       jobmanager.rpc.address: jobmanager
       state.backend: hashmap
       state.checkpoints.dir: file:///tmp/flink-checkpoints
       heartbeat.interval: 1000
       heartbeat.timeout: 5000
       rest.flamegraph.enabled: true
       web.backpressure.refresh-interval: 10000

 taskmanager:
   build: ./Docker/flink/
   container_name: taskmanager
   depends_on:
     - jobmanager
   command: taskmanager
   volumes:
     - flink_data:/tmp/
   environment:
     - |
       FLINK_PROPERTIES=
       jobmanager.rpc.address: jobmanager
       taskmanager.numberOfTaskSlots: 3
       state.backend: hashmap
       state.checkpoints.dir: file:///tmp/flink-checkpoints
       heartbeat.interval: 1000
       heartbeat.timeout: 5000
       
 ollama:
    build: ./Docker/ollama/
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    ports:
      - "11434:11434"

 mongodb:
    hostname: mongodb
    build: ./Docker/mongodb/
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - mongo_mongot:/data/mongot # Stores index for vector search
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword

volumes:
  flink_data:
  ollama_data:
  mongo_data:
  mongo_config:
  mongo_mongot:

